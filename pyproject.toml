[project]
name = "helper"
version = "0.1.0"
description = "Job application helper: tailored one-page resume, form filling, and tracking from one job URL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "playwright>=1.45",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
helper = "helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
