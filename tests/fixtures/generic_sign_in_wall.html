<!doctype html>
<!-- A careers portal that wants an account before its form: the generic adapter leaves it to Vatsal (rule 8). -->
<html><head><meta charset="utf-8"><title>Candidate Portal</title></head>
<body><main>
  <h1>Machine Learning Intern</h1>
  <p>Join our applied research team.</p>
  <h2>Sign in to apply</h2>
  <form><label for="u">Email or username</label><input id="u" name="user">
    <label for="p">Password</label><input id="p" name="pass" type="password"><button>Sign in</button></form>
  <p>New here? <a href="#register">Create an account</a></p>
</main></body></html>
