<!doctype html>
<!-- A company's careers page around the iCIMS application frame, like City National's (2026-11-15): the company's
     own page carries an unrelated sign-in (online banking) that helper must never type into. -->
<html>
<head><meta charset="utf-8"><title>Mockco Bank - Careers - Login</title></head>
<body>
<header>
  <h2>Online Banking</h2>
  <label for="userid">Username *</label><input id="userid" name="userid" type="text">
  <label for="db-password">Password *</label><input id="db-password" name="password" type="password">
  <button type="button">Login</button>
</header>
<main>
  <iframe id="icims_content_iframe" src="https://careers-mockco.icims.com/jobs/77/login?in_iframe=1" width="1000" height="900"></iframe>
</main>
</body>
</html>
