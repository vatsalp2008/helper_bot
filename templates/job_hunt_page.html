<title>Job Hunt Queue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: one narrow column, the session summary on top, status filters, then posting rows grouped by what they need from you. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #1c2230; --muted: #5d6576; --line: #dfe3ea; --accent: #2346c7;
  --needs: #b5470f; --needs-bg: #fdf0e7; --ready: #2346c7; --ready-bg: #ebf0ff; --applying: #12795a; --applying-bg: #e6f5ef;
  --queued: #5d6576; --queued-bg: #eef0f4; --skipped: #8a91a0; --skipped-bg: #f1f2f5;
  --manual: #7b3fb3; --manual-bg: #f3ecfa;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151c; --surface: #1a1f29; --ink: #e6e9f0; --muted: #9aa3b5; --line: #2b3240; --accent: #8ea6ff;
  --needs: #f2a067; --needs-bg: #3a2416; --ready: #8ea6ff; --ready-bg: #1f2747; --applying: #5fd1a7; --applying-bg: #15332a;
  --queued: #aab2c2; --queued-bg: #242a36; --skipped: #7d8597; --skipped-bg: #1f242e; color-scheme: dark;
  --manual: #c7a2f2; --manual-bg: #2b2140;
} }
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1f29; --ink: #e6e9f0; --muted: #9aa3b5; --line: #2b3240; --accent: #8ea6ff;
  --needs: #f2a067; --needs-bg: #3a2416; --ready: #8ea6ff; --ready-bg: #1f2747; --applying: #5fd1a7; --applying-bg: #15332a;
  --queued: #aab2c2; --queued-bg: #242a36; --skipped: #7d8597; --skipped-bg: #1f242e; color-scheme: dark;
  --manual: #c7a2f2; --manual-bg: #2b2140;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: grid; gap: 6px; margin-bottom: 18px; }
h1 { font-family: var(--font-head); font-weight: 600; font-size: 28px; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.session { color: var(--muted); font-size: 14px; max-width: 65ch; }
.session strong { color: var(--ink); font-weight: 500; }
.notice { font-size: 13px; color: var(--needs); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 20px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip:focus-visible, .copy:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section.group { margin-bottom: 26px; }
.group h2 { font-family: var(--font-head); font-weight: 600; font-size: 13px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.group h2 .n { font-family: var(--font-mono); letter-spacing: 0; }
.group .hint { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
ul.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 0 12px 12px;
  border-bottom: 1px solid var(--line); border-left: 3px solid var(--stripe, var(--line)); }
.row .main { min-width: 0; }
.row .co { font-weight: 600; }
.row .title { overflow-wrap: anywhere; }
.row .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
.row .sys { font-family: var(--font-mono); font-size: 12px; }
.row .reason { font-size: 13px; margin-top: 6px; color: var(--ink); overflow-wrap: anywhere; }
.row .side { display: grid; gap: 6px; justify-items: end; align-content: start; }
.pill { font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 10px; white-space: nowrap;
  color: var(--pill-fg); background: var(--pill-bg); }
.row a.open { font-size: 13px; color: var(--accent); text-decoration: none; white-space: nowrap; }
.row a.open:hover { text-decoration: underline; }
.cmd { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.cmd code { font-family: var(--font-mono); font-size: 12px; background: var(--queued-bg); border-radius: 6px;
  padding: 3px 8px; overflow-wrap: anywhere; user-select: all; }
.copy { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.s-needs_you { --stripe: var(--needs); --pill-fg: var(--needs); --pill-bg: var(--needs-bg); }
.s-ready_for_you { --stripe: var(--ready); --pill-fg: var(--ready); --pill-bg: var(--ready-bg); }
.s-apply_manually { --stripe: var(--manual); --pill-fg: var(--manual); --pill-bg: var(--manual-bg); }
.s-applying { --stripe: var(--applying); --pill-fg: var(--applying); --pill-bg: var(--applying-bg); }
.s-queued { --stripe: var(--queued); --pill-fg: var(--queued); --pill-bg: var(--queued-bg); }
.s-skipped { --stripe: var(--line); --pill-fg: var(--skipped); --pill-bg: var(--skipped-bg); }
.s-skipped .co, .s-skipped .title { color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 22px; color: var(--muted); max-width: 65ch; }
.empty strong { color: var(--ink); }
@media (max-width: 520px) { li.row { grid-template-columns: 1fr; } .row .side { justify-items: start; grid-auto-flow: column; justify-content: start; } }
@media (prefers-reduced-motion: no-preference) { li.row { transition: background-color .2s; } }
</style>

<div class="wrap">
  <header>
    <h1>Job Hunt Queue</h1>
    <p class="session" id="session">The scheduled job hunt runs at 2am, 5am, 8am, 11am, 2pm, 5pm, 8pm and 11pm. Each run finds new postings, applies to the ones helper can fill, and leaves the rest here.</p>
    <p class="notice" id="notice" hidden></p>
  </header>
  <div class="filters" id="filters" role="toolbar" aria-label="Filter by status"></div>
  <div id="list">
    <div class="empty" id="empty">
      <strong>Loading the list.</strong> Postings that need you, ones only you can submit, and what helper is applying to will show here.
    </div>
  </div>
</div>

<script>
(function () {
  var STATUS = {
    needs_you: { label: "Needs you", hint: "helper stopped here; the browser window is still open on your Mac." },
    apply_manually: { label: "Apply manually", hint: "Apply on the company's own site yourself: helper's attempt didn't go through, or it couldn't confirm it did." },
    ready_for_you: { label: "Ready for you", hint: "helper can't submit these. The resume and cover letter are built; run the command in the helper folder to open the posting with a paste sheet." },
    applying: { label: "Applying", hint: "helper is tailoring or filling these now." },
    queued: { label: "Queued", hint: "Picked this session, not started yet." },
    skipped: { label: "Skipped", hint: "Not applied to, with the reason." }
  };
  var ORDER = ["needs_you", "apply_manually", "ready_for_you", "applying", "queued", "skipped"];
  var rows = [];
  var meta = null;
  var loaded = false;
  var filter = "all";
  try { filter = localStorage.getItem("jhq-filter") || "all"; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function ago(value) {
    if (!value) return "";
    var t = Date.parse(value);
    if (isNaN(t)) return String(value).slice(0, 10);
    var mins = Math.round((Date.now() - t) / 60000);
    if (mins < 60) return mins <= 1 ? "just now" : mins + " min ago";
    var hours = Math.round(mins / 60);
    if (hours < 36) return hours + " h ago";
    return Math.round(hours / 24) + " days ago";
  }

  function renderFilters() {
    var box = $("filters");
    box.textContent = "";
    var counts = { all: rows.length };
    ORDER.forEach(function (s) { counts[s] = rows.filter(function (r) { return r.status === s; }).length; });
    ["all"].concat(ORDER).forEach(function (s) {
      if (s !== "all" && !counts[s]) return;
      var b = el("button", "chip");
      b.type = "button";
      b.id = "filter-" + s;
      b.setAttribute("aria-pressed", String(filter === s));
      b.appendChild(el("span", null, s === "all" ? "All" : STATUS[s].label));
      b.appendChild(el("span", "n", String(counts[s])));
      b.addEventListener("click", function () {
        filter = s;
        try { localStorage.setItem("jhq-filter", s); } catch (e) {}
        render();
      });
      box.appendChild(b);
    });
  }

  function copyButton(text) {
    var b = el("button", "copy", "Copy");
    b.type = "button";
    b.addEventListener("click", function () {
      var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1500); };
      try {
        navigator.clipboard.writeText(text).then(done, function () { select(b.previousSibling); });
      } catch (e) { select(b.previousSibling); }
    });
    return b;
  }

  function select(node) {
    try { var r = document.createRange(); r.selectNodeContents(node); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }

  function rowNode(r) {
    var li = el("li", "row s-" + r.status);
    var main = el("div", "main");
    var head = el("div");
    head.appendChild(el("span", "co", r.company || "?"));
    head.appendChild(document.createTextNode(" · "));
    head.appendChild(el("span", "title", r.title || ""));
    main.appendChild(head);
    var m = el("div", "meta");
    if (r.location) m.appendChild(el("span", null, r.location));
    if (r.ats) m.appendChild(el("span", "sys", r.ats));
    if (r.posted_at) m.appendChild(el("span", null, "posted " + ago(r.posted_at)));
    if (r.updated_at) m.appendChild(el("span", null, "updated " + ago(r.updated_at)));
    main.appendChild(m);
    if (r.reason) main.appendChild(el("div", "reason", r.reason));
    if ((r.status === "ready_for_you" || r.status === "apply_manually") && r.run_id) {
      var cmd = el("div", "cmd");
      var code = el("code", null, "helper assist " + r.run_id);
      cmd.appendChild(code);
      cmd.appendChild(copyButton(code.textContent));
      main.appendChild(cmd);
    } else if (r.run_id) {
      var run = el("div", "meta");
      run.appendChild(el("span", "sys", "run " + r.run_id));
      main.appendChild(run);
    }
    var side = el("div", "side");
    side.appendChild(el("span", "pill", (STATUS[r.status] || { label: r.status }).label));
    if (r.url) {
      var a = el("a", "open", "Open posting ↗");
      a.href = r.url;
      a.target = "_blank";
      a.rel = "noopener";
      side.appendChild(a);
    }
    li.appendChild(main);
    li.appendChild(side);
    return li;
  }

  function render() {
    renderFilters();
    if (meta && meta.note) {
      var s = $("session");
      s.textContent = "";
      s.appendChild(el("strong", null, "Last session"));
      s.appendChild(document.createTextNode(" (" + ago(meta.updated_at) + "): " + meta.note));
    }
    if (!loaded) return;  // keep the loading note until the first snapshot
    var list = $("list");
    list.textContent = "";
    if (!rows.length) {
      var empty = el("div", "empty");
      empty.appendChild(el("strong", null, "Nothing on the list right now. "));
      empty.appendChild(document.createTextNode("Every posting found so far has been applied to. The next session adds what it finds."));
      list.appendChild(empty);
      return;
    }
    ORDER.forEach(function (s) {
      if (filter !== "all" && filter !== s) return;
      var group = rows.filter(function (r) { return r.status === s; });
      if (!group.length) return;
      group.sort(function (a, b) { return String(b.updated_at || "").localeCompare(String(a.updated_at || "")); });
      var sec = el("section", "group");
      var h = el("h2", null, STATUS[s].label);
      h.appendChild(el("span", "n", String(group.length)));
      sec.appendChild(h);
      sec.appendChild(el("p", "hint", STATUS[s].hint));
      var ul = el("ul", "rows");
      group.forEach(function (r) { ul.appendChild(rowNode(r)); });
      sec.appendChild(ul);
      list.appendChild(sec);
    });
  }

  function notice(text) {
    var n = $("notice");
    n.textContent = text || "";
    n.hidden = !text;
  }

  async function start() {
    if (!window.claude || !window.claude.use) {
      notice("Open this page on claude.ai to see the live list.");
      return;
    }
    var db = await window.claude.use("db");
    if (!db) {
      notice("The list can't be loaded in this view. Open it on claude.ai while signed in.");
      return;
    }
    var timer = setTimeout(function () { notice("The list can't be reached yet; it will appear when the connection returns."); }, 10000);
    // the whole list is one record, written by each job hunt session: {rows, note, updated_at}
    db.doc("hunt/list").onSnapshot(function (snap) {
      var body = snap.exists ? snap.data() : null;
      rows = body && Array.isArray(body.rows) ? body.rows.slice() : [];
      meta = body ? { note: body.note, updated_at: body.updated_at } : null;
      loaded = true;
      if (!snap.metadata.fromCache) { clearTimeout(timer); notice(""); }
      render();
    }, function (err) {
      clearTimeout(timer);
      notice("The list stopped updating (" + err.code + "). Reload the page to try again.");
    });
  }

  render();
  start();
})();
</script>
