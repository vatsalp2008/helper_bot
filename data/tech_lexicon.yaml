# T-Mobile's "Fiber Growth team" (2026-11-20) isn't Go's Fiber framework: bare "Fiber" is the product far more
# often than the framework, so only "Go Fiber" or "GoFiber" name it
exclude: [Vision, Fiber]

ignore: ["R&D", "Q&A", "C-suite", "C-level", "go-to-market", "A/B", "R squared", "R-squared", "R²", "R^2",
         "Rocky Mountains", "Rocky Mountain"]  # Melaleuca's "the Rocky Mountains" isn't Rocky Linux (2026-11-20)

