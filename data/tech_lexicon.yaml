# Technology vocabulary for finding tech names in text. `helper convert` uses it to collect each item's
# technologies from its master-list text; the resume validator uses it to spot technologies in bullets.
#
# Every name in the master list's Technologies lines, and every name-like entry in its Skills section,
# is added automatically. This file adds:
#   aliases         other spellings of one technology, keyed by the name helper reports
#   common          well-known technologies, most NOT in the master list, so a bullet that names one for
#                   an item that never used it gets caught
#   case_sensitive  names that are also ordinary words; matched only with this exact capitalization
#                   (names of 1-2 characters, like C, R, Go, are always case-sensitive)
#   exclude         spellings never matched on their own (too ambiguous)
#   ignore          phrases that look like a technology but are not (masked before matching)
#   implies         platforms built on another technology. An item that uses the platform also counts
#                   as using that technology, including for the master list's Database framing rule.

